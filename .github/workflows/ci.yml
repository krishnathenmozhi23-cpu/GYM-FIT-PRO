name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymfit
          POSTGRES_PASSWORD: gymfit
          POSTGRES_DB: gymfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymfit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gymfit:gymfit@localhost:5432/gymfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql postgres://gymfit:gymfit@localhost:5432/gymfit -c "CREATE DATABASE gymfit_test"
      - run: npm run typecheck
      - run: npm test
      - name: API tests on embedded PGlite (zero-config dev database)
        run: npm test -w @gymfit/api
        env:
          TEST_DB: pglite
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No .env: exercises the zero-config path (embedded PGlite, auto-migrate + seed).
      - run: npm run test:e2e
